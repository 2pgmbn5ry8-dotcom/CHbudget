<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BudgetTrack">
  <meta name="theme-color" content="#0f0f11">
  <title>BudgetTrack</title>

  <style>
    /* ══════════════════════════════════════════════════════
       RESET & ROOT VARIABLES
    ══════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0f0f11;
      --bg2:          #17171b;
      --bg3:          #1f1f26;
      --bg4:          #27272f;
      --border:       #2e2e3a;
      --text:         #e8e8f0;
      --text2:        #9090aa;
      --text3:        #5a5a72;
      --accent:       #6c6cff;
      --accent2:      #4444cc;
      --green:        #2dd878;
      --green-dim:    #1a5a38;
      --red:          #ff5566;
      --red-dim:      #5a1a22;
      --orange:       #ffaa44;
      --orange-dim:   #5a3a10;
      --teal:         #44ddcc;
      --teal-dim:     #1a4a44;
      --yellow:       #ffd144;
      --purple:       #aa66ff;
      --radius:       12px;
      --radius-sm:    8px;
      --shadow:       0 2px 12px rgba(0,0,0,0.4);
      --header-h:     52px;
      --nav-h:        58px;
      --font:         -apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
      --font-mono:    'SF Mono', 'Menlo', monospace;
    }

    html {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      overscroll-behavior: none;
    }

    button { font-family: var(--font); cursor: pointer; border: none; }
    input, select, textarea { font-family: var(--font); }

    /* ══════════════════════════════════════════════════════
       APP SHELL
    ══════════════════════════════════════════════════════ */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* ── Header ───────────────────────────────────────────── */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-h);
      background: rgba(15,15,17,0.92);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-h);
      padding: 0 16px;
    }

    .logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .today {
      font-size: 12px;
      color: var(--text2);
    }

    /* ── Tab Nav ──────────────────────────────────────────── */
    .tab-nav {
      position: sticky;
      top: var(--header-h);
      z-index: 99;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      background: rgba(15,15,17,0.95);
      border-bottom: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
      gap: 2px;
      padding: 0 4px;
    }
    .tab-nav::-webkit-scrollbar { display: none; }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 12px 6px;
      background: none;
      color: var(--text3);
      border-radius: 0;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
      font-size: 10px;
    }
    .tab-btn .tab-icon { font-size: 16px; line-height: 1; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:active { opacity: 0.7; }

    /* ── Content ──────────────────────────────────────────── */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }

    /* ══════════════════════════════════════════════════════
       SHARED COMPONENTS
    ══════════════════════════════════════════════════════ */

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text3);
      margin: 20px 0 8px;
    }
    .section-title:first-child { margin-top: 0; }
    .section-title .badge {
      background: var(--bg4);
      color: var(--text2);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }

    .empty-state {
      text-align: center;
      color: var(--text3);
      padding: 24px 16px;
      font-size: 14px;
    }

    .empty { color: var(--text3); padding: 32px; text-align: center; }

    /* Form elements */
    .form-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      margin-bottom: 8px;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--accent); }

    .form-select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      margin-bottom: 8px;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }
    .form-select.small { font-size: 13px; padding: 7px 10px; margin: 0; }

    .form-textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 8px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 4px;
    }

    /* Buttons */
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-primary:active { opacity: 0.8; transform: scale(0.97); }

    .btn-secondary {
      background: var(--bg4);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 500;
    }

    .btn-danger {
      background: var(--red-dim);
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
    }

    .icon-btn {
      background: var(--bg4);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 14px;
    }

    .del-btn {
      background: var(--red-dim);
      color: var(--red);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      margin-left: 8px;
    }

    .pos { color: var(--green); }
    .neg { color: var(--red); }

    /* ══════════════════════════════════════════════════════
       BY CHECK
    ══════════════════════════════════════════════════════ */
    .bycheck-wrap {}

    .check-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .check-nav.mini { margin-bottom: 12px; }

    .nav-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      width: 40px;
      height: 40px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .nav-btn:disabled { opacity: 0.3; }

    .check-header-info {
      flex: 1;
      text-align: center;
    }
    .check-date { font-size: 18px; font-weight: 700; }
    .check-income-name {
      font-size: 12px; color: var(--text2); margin-top: 2px;
      display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
    }

    /* Check type badge */
    .check-type-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      display: inline-block;
    }
    .badge-primary {
      background: rgba(108,108,255,0.18);
      color: var(--accent);
      border: 1px solid rgba(108,108,255,0.35);
    }
    .badge-extra {
      background: rgba(255,170,68,0.18);
      color: var(--orange);
      border: 1px solid rgba(255,170,68,0.35);
    }

    /* Extra check notice banner */
    .extra-check-notice {
      background: rgba(255,170,68,0.1);
      border: 1px solid rgba(255,170,68,0.3);
      color: var(--orange);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 12px;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    /* Dim card (living = n/a on extra checks) */
    .sum-card.dim { opacity: 0.35; }
    .dim-val { color: var(--text3) !important; }

    /* Income type note in setup */
    .income-type-note {
      font-size: 12px;
      color: var(--text3);
      line-height: 1.5;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: var(--bg3);
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent);
    }
    .check-counter { font-size: 11px; color: var(--text3); margin-top: 1px; }

    .jump-bar { margin-bottom: 12px; }

    .suggestion-box {
      background: var(--orange-dim);
      border: 1px solid var(--orange);
      color: var(--orange);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .suggestion-box.warning { background: var(--red-dim); border-color: var(--red); color: var(--red); }

    /* Summary cards */
    .check-summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .sum-card {
      background: var(--bg3);
      border-radius: var(--radius);
      padding: 12px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .sum-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .sum-val   { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .sum-card.green  .sum-val { color: var(--green); }
    .sum-card.red    .sum-val { color: var(--red); }
    .sum-card.orange .sum-val { color: var(--orange); }
    .sum-card.teal   .sum-val { color: var(--teal); }

    /* Paid progress */
    .paid-progress-wrap { margin-bottom: 14px; }
    .paid-bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
    .paid-bar { background: var(--bg4); border-radius: 4px; height: 6px; overflow: hidden; }
    .paid-fill { background: linear-gradient(90deg, var(--green), var(--teal)); height: 100%; border-radius: 4px; transition: width 0.4s; }

    /* Bills list */
    .bills-list { display: flex; flex-direction: column; gap: 6px; }

    .bill-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      transition: opacity 0.2s;
    }
    .bill-row.paid { opacity: 0.5; }

    .bill-check-wrap { flex-shrink: 0; }
    .bill-checkbox {
      width: 20px; height: 20px;
      accent-color: var(--green);
      cursor: pointer;
    }

    .bill-info { flex: 1; min-width: 0; }
    .bill-name { font-size: 14px; font-weight: 600; }
    .bill-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }

    .bill-amount { font-size: 15px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .bill-amount.paid-amount { color: var(--green); }

    .move-btn {
      background: var(--bg4);
      color: var(--text2);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* Move modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      padding: 16px;
    }
    .modal.hidden { display: none; }

    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .modal-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }

    .btn-move-option {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      text-align: left;
      font-size: 14px;
      width: 100%;
    }
    .btn-move-option:active { background: var(--accent2); }

    /* Extra income */
    .extra-income-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .extra-income-row .form-input { margin-bottom: 0; flex: 1; }
    .extra-badge {
      font-size: 13px;
      color: var(--green);
      margin-bottom: 8px;
    }

    /* ══════════════════════════════════════════════════════
       OVERVIEW
    ══════════════════════════════════════════════════════ */
    .overview-wrap {}
    .overview-table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }

    .overview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .overview-table th {
      background: var(--bg3);
      color: var(--text2);
      text-align: right;
      padding: 8px 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 10px;
      white-space: nowrap;
    }
    .overview-table th:first-child,
    .overview-table th:nth-child(2) { text-align: left; }

    .overview-table td {
      padding: 7px 10px;
      border-top: 1px solid var(--border);
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .overview-table td:first-child,
    .overview-table td:nth-child(2) { text-align: left; }

    .month-row td {
      background: var(--bg4);
      font-weight: 600;
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .check-row { cursor: pointer; }
    .check-row:hover td { background: var(--bg3); }
    .check-row:active td { background: var(--bg4); }

    .today-row td { background: rgba(108,108,255,0.08); }
    .today-row td:first-child { border-left: 2px solid var(--accent); }

    /* ══════════════════════════════════════════════════════
       DEBT
    ══════════════════════════════════════════════════════ */
    .debt-wrap {}

    .debt-cards { display: flex; flex-direction: column; gap: 8px; }

    .debt-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .debt-card-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .debt-name { font-weight: 600; font-size: 15px; }
    .debt-apr { font-size: 12px; color: var(--orange); background: var(--orange-dim); padding: 2px 8px; border-radius: 10px; }
    .debt-balance { font-size: 22px; font-weight: 700; color: var(--red); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
    .debt-bar { background: var(--bg4); border-radius: 4px; height: 5px; margin-bottom: 6px; }
    .debt-fill { background: linear-gradient(90deg, var(--red), var(--orange)); height: 100%; border-radius: 4px; }
    .debt-min { font-size: 11px; color: var(--text3); }

    .total-debt-badge {
      background: var(--red-dim);
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
      margin: 12px 0;
    }

    .strategy-row {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .radio-label small { color: var(--text3); font-size: 11px; }
    .radio-label input[type="radio"] { accent-color: var(--accent); }

    .extra-payment-row { margin-bottom: 12px; }
    .input-row { display: flex; gap: 8px; }
    .input-row .form-input { margin-bottom: 0; }

    .debt-result-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      margin: 12px 0;
    }
    .debt-result-title { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
    .debt-result-big { font-size: 26px; font-weight: 700; color: var(--green); margin: 8px 0 4px; }
    .debt-result-sub { font-size: 13px; color: var(--text2); }

    /* mini debt chart */
    .debt-chart-wrap { overflow-x: auto; }
    .mini-chart {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 80px;
      padding: 4px 0;
    }
    .chart-bar {
      flex: 1;
      background: linear-gradient(180deg, var(--red), var(--orange));
      border-radius: 2px 2px 0 0;
      min-width: 6px;
      transition: height 0.4s;
    }
    .chart-labels { display: flex; font-size: 11px; color: var(--text3); margin-top: 4px; }

    /* ══════════════════════════════════════════════════════
       SAVINGS
    ══════════════════════════════════════════════════════ */
    .savings-wrap {}

    .savings-goal-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 4px;
    }

    .goal-amounts {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }
    .goal-cur { font-size: 28px; font-weight: 700; color: var(--green); }
    .goal-sep { color: var(--text3); font-size: 14px; }
    .goal-total { font-size: 18px; color: var(--text2); }

    .savings-bar { background: var(--bg4); border-radius: 6px; height: 10px; margin-bottom: 10px; overflow: hidden; }
    .savings-fill { background: linear-gradient(90deg, var(--teal), var(--green)); height: 100%; border-radius: 6px; transition: width 0.5s; }

    .savings-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); }
    .savings-target-date { font-size: 13px; color: var(--accent); margin-top: 8px; font-weight: 600; }

    .savings-log-form { display: flex; flex-direction: column; }

    .savings-log { display: flex; flex-direction: column; gap: 6px; }
    .log-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .log-date { font-size: 13px; font-weight: 600; }
    .log-note { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .log-amount { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ══════════════════════════════════════════════════════
       SPENDING
    ══════════════════════════════════════════════════════ */
    .spending-wrap {}
    .spending-summary { display: flex; gap: 8px; margin-bottom: 4px; }
    .spending-summary .sum-card { flex: 1; }

    .spending-form { display: flex; flex-direction: column; }

    .spend-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 6px;
    }
    .spend-desc { font-size: 14px; font-weight: 600; }
    .spend-meta { font-size: 11px; color: var(--text3); }
    .spend-right { display: flex; align-items: center; flex-shrink: 0; }
    .spend-amt { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ══════════════════════════════════════════════════════
       IMPULSE LOG
    ══════════════════════════════════════════════════════ */
    .impulse-wrap {}

    .impulse-intro { font-size: 13px; color: var(--text2); margin-bottom: 8px; }

    .impulse-saved-badge {
      background: var(--green-dim);
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .impulse-form { display: flex; flex-direction: column; }

    .impulse-list { display: flex; flex-direction: column; gap: 6px; }
    .impulse-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .impulse-main { flex: 1; min-width: 0; }
    .impulse-item { font-size: 14px; font-weight: 600; }
    .impulse-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .impulse-right { display: flex; align-items: center; flex-shrink: 0; }
    .impulse-amt { font-size: 15px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }

    /* ══════════════════════════════════════════════════════
       STREAKS
    ══════════════════════════════════════════════════════ */
    .streaks-wrap {}

    .streak-hero {
      text-align: center;
      padding: 24px 0 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .streak-flame { font-size: 48px; line-height: 1; }
    .streak-count { font-size: 64px; font-weight: 800; color: var(--orange); line-height: 1; letter-spacing: -2px; }
    .streak-label { font-size: 14px; color: var(--text2); margin-top: 4px; }

    .streak-tip { font-size: 12px; color: var(--text3); text-align: center; margin-bottom: 16px; }

    .cal-month { margin-bottom: 20px; }
    .cal-month-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
    .cal-dow { text-align: center; font-size: 10px; color: var(--text3); font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.15s;
      color: var(--text2);
    }
    .cal-cell.empty { cursor: default; }
    .cal-cell:not(.empty):not(.future):hover { background: var(--bg4); }
    .cal-cell.no-spend { background: var(--green); color: #000; font-weight: 700; }
    .cal-cell.cal-today { border: 2px solid var(--accent); color: var(--accent); }
    .cal-cell.cal-today.no-spend { background: var(--green); border-color: var(--green); color: #000; }
    .cal-cell.future { color: var(--text3); cursor: default; }

    .streak-stats { display: flex; gap: 8px; margin-top: 4px; }
    .stat-pill {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      text-align: center;
    }
    .sp-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; display: block; }
    .sp-val { font-size: 20px; font-weight: 700; color: var(--orange); }

    /* ══════════════════════════════════════════════════════
       STATS
    ══════════════════════════════════════════════════════ */
    .stats-wrap {}

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .stat-card.green-card { border-color: var(--green-dim); }
    .stat-card.red-card   { border-color: var(--red-dim); }

    .stat-lbl { font-size: 11px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

    .stats-highlights {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }
    .highlight-card {
      flex: 1;
      background: var(--bg3);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
    }
    .highlight-card.best  { border: 1px solid var(--green-dim); }
    .highlight-card.worst { border: 1px solid var(--red-dim); }
    .hl-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
    .hl-date  { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .hl-val   { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .monthly-chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 100px;
      overflow-x: auto;
      padding: 4px 0 0;
    }
    .mc-col { display: flex; flex-direction: column; align-items: center; min-width: 20px; flex: 1; }
    .mc-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; min-height: 80px; }
    .mc-bar { width: 100%; border-radius: 3px 3px 0 0; }
    .mc-pos { background: linear-gradient(180deg, var(--teal), var(--green)); }
    .mc-neg { background: linear-gradient(180deg, var(--orange), var(--red)); }
    .mc-label { font-size: 9px; color: var(--text3); margin-top: 3px; white-space: nowrap; }

    /* ══════════════════════════════════════════════════════
       SETUP
    ══════════════════════════════════════════════════════ */
    .setup-wrap {}

    .setup-subtab-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .setup-subtab-nav::-webkit-scrollbar { display: none; }

    .setup-subtab-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .setup-subtab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .setup-section {}

    .setup-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
    .setup-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .setup-item-info { flex: 1; min-width: 0; }
    .setup-name { font-size: 14px; font-weight: 600; display: block; }
    .setup-meta { font-size: 11px; color: var(--text3); margin-top: 2px; display: block; }
    .setup-actions { display: flex; gap: 6px; }

    .setup-form { display: flex; flex-direction: column; }

    .danger-zone { color: var(--red); }
    .danger-note { font-size: 12px; color: var(--text3); margin-top: 8px; }

    /* ══════════════════════════════════════════════════════
       TOAST
    ══════════════════════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg4);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 20px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: var(--shadow);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ══════════════════════════════════════════════════════
       SCROLLBAR (desktop only)
    ══════════════════════════════════════════════════════ */
    @media (pointer: fine) {
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
    }
  </style>
</head>

    <div style="display:flex;align-items:center;justify-content:center;height:100dvh;color:#5a5a72;font-size:14px;">
      Loading BudgetTrack…
    </div>
  </div>

  <script src="bt_core.js"></script>
  <script src="bt_features.js"></script>
</body>
